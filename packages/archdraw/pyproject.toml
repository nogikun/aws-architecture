[project]
name = "archdraw"
version = "0.1.0"
description = "システム構成図を Python / YAML で書き、自動配置・経路探索・検査をして、編集できる draw.io の図にする"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.scripts]
archdraw = "archdraw.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archdraw"]

[tool.ruff]
line-length = 120
